<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 17 · Tabla de multiplicar</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="ejercicio17.html">

<main class="wrap">
  <header class="encabezado">
    <p class="eyebrow">Ejercicio 17 · Ciclo Para</p>
    <h1>Tabla de multiplicar</h1>
    <p class="descripcion">Se obtiene la tabla de multiplicar de un entero K, comenzando desde el 1.</p>
  </header>

  <section class="tarjeta">
    <div class="form-grid">
      <div class="campo">
        <label for="k">Número K</label>
        <input type="number" id="k" value="7" step="1">
      </div>
      <div class="campo">
        <label for="hasta">Multiplicar hasta</label>
        <input type="number" id="hasta" value="10" min="1" step="1">
      </div>
    </div>
    <button id="btn-calcular">Generar tabla</button>
  </section>

  <div class="tabla-scroll oculto" id="panel-tabla">
    <table class="tabla">
      <thead><tr><th>Multiplicación</th><th>Resultado</th></tr></thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </div>
</main>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/ejercicio17.js"></script>
</body>
</html>
