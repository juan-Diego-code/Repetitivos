<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 18 · Interés compuesto</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="ejercicio18.html">

<main class="wrap">
  <header class="encabezado">
    <p class="eyebrow">Ejercicio 18 · Ciclo Para</p>
    <h1>Interés compuesto: P(1+i)<sup>n</sup></h1>
    <p class="descripcion">En 1961 una persona vendió unas tierras y colocó el dinero en una cuenta que paga interés fijo anual. El algoritmo calcula cuánto vale la inversión hoy, año por año.</p>
  </header>

  <section class="tarjeta">
    <div class="form-grid">
      <div class="campo">
        <label for="capital">Capital inicial (P)</label>
        <input type="number" id="capital" value="10500" min="0">
      </div>
      <div class="campo">
        <label for="tasa">Tasa de interés anual (%)</label>
        <input type="number" id="tasa" value="15" min="0" step="0.1">
      </div>
      <div class="campo">
        <label for="anio-inicial">Año en que se invirtió</label>
        <input type="number" id="anio-inicial" value="1961" step="1">
      </div>
    </div>
    <button id="btn-calcular">Calcular valor actual</button>
  </section>

  <div class="tabla-scroll oculto" id="panel-tabla">
    <table class="tabla">
      <thead><tr><th>Año</th><th>Valor de la inversión</th></tr></thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </div>

  <section class="resumen oculto" id="panel-resumen">
    <div class="total-final">
      <span class="label" id="etiqueta-final">Valor actual de la inversión</span>
      <span class="valor" id="valor-final">$0</span>
    </div>
  </section>
</main>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/ejercicio18.js"></script>
</body>
</html>
