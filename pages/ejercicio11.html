<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 11 · Función exponencial e^x</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="pages/ejercicio11.html">

<main class="wrap">
  <header class="encabezado">
    <p class="eyebrow">Ejercicio 11 · Ciclo Para</p>
    <h1>Función exponencial e<sup>x</sup></h1>
    <p class="descripcion">Se aproxima e<sup>x</sup> mediante la serie: 1 + x/1! + x²/2! + x³/3! + ... Entre más términos se sumen, más se acerca el resultado al valor real.</p>
  </header>

  <section class="tarjeta">
    <div class="form-grid">
      <div class="campo">
        <label for="x">Valor de x</label>
        <input type="number" id="x" value="1" step="any">
      </div>
      <div class="campo">
        <label for="terminos">Número de términos</label>
        <input type="number" id="terminos" value="10" min="1" step="1">
      </div>
    </div>
    <button id="btn-calcular">Calcular</button>
  </section>

  <div class="tabla-scroll oculto" id="panel-tabla">
    <table class="tabla">
      <thead><tr><th>Término</th><th>Valor del término</th><th>Suma acumulada</th></tr></thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </div>

  <section class="resumen oculto" id="panel-resumen">
    <div class="fila-resumen"><span>Aproximación por serie</span><span class="valor" id="resultado-serie">0</span></div>
    <div class="fila-resumen"><span>Valor real (Math.exp)</span><span class="valor" id="resultado-real">0</span></div>
    <div class="total-final"><span class="label">Diferencia</span><span class="valor" id="diferencia">0</span></div>
  </section>
</main>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/ejercicio11.js"></script>
</body>
</html>
