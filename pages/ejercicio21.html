<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 21 · Monedero</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="pages/ejercicio21.html">

<main class="wrap">
  <header class="encabezado">
    <p class="eyebrow">Ejercicio 21 · Ciclo Para</p>
    <h1>¿Cuánto dinero hay en el monedero?</h1>
    <p class="descripcion">Se tienen monedas de $100, $200 y $500, y billetes de $2.000, $5.000 y $10.000. Indica cuántos hay de cada denominación.</p>
  </header>

  <section class="tarjeta">
    <h2>Monedas</h2>
    <div class="form-grid">
      <div class="campo"><label for="d100">Monedas de $100</label><input type="number" id="d100" min="0" step="1" value="0"></div>
      <div class="campo"><label for="d200">Monedas de $200</label><input type="number" id="d200" min="0" step="1" value="0"></div>
      <div class="campo"><label for="d500">Monedas de $500</label><input type="number" id="d500" min="0" step="1" value="0"></div>
    </div>
  </section>

  <section class="tarjeta">
    <h2>Billetes</h2>
    <div class="form-grid">
      <div class="campo"><label for="d2000">Billetes de $2.000</label><input type="number" id="d2000" min="0" step="1" value="0"></div>
      <div class="campo"><label for="d5000">Billetes de $5.000</label><input type="number" id="d5000" min="0" step="1" value="0"></div>
      <div class="campo"><label for="d10000">Billetes de $10.000</label><input type="number" id="d10000" min="0" step="1" value="0"></div>
    </div>
    <button id="btn-calcular">Calcular total</button>
  </section>

  <section class="resumen oculto" id="panel-resumen">
    <div class="total-final">
      <span class="label">Total en el monedero</span>
      <span class="valor" id="total">$0</span>
    </div>
  </section>
</main>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/ejercicio21.js"></script>
</body>
</html>
